[package]
name = "gto-runner"
version = "0.1.0"
edition = "2021"

[dependencies]
postflop-solver = { path = "../vendor/postflop-solver", default-features = false, features = ["rayon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
sha2 = "0.10"
anyhow = "1"
rayon = "1.8"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
